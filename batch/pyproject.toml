[project]
name = "oaria-batch"
version = "0.1.0"
description = "암 논문 수집 배치 시스템"
requires-python = ">=3.11"
dependencies = [
    # Celery
    "celery[redis]>=5.3.0",
    "flower>=2.0.0",

    # HTTP Client
    "httpx>=0.27.0",

    # Database
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.1.0",

    # S3
    "boto3>=1.34.0",

    # XML Parsing
    "lxml>=5.0.0",

    # Data Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Utilities
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
