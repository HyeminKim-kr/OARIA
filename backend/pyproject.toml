[project]
name = "backend"
version = "0.1.0"
description = "OARIA Backend API with Google OAuth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # FastAPI
    "fastapi>=0.115.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
    # Database (SQLAlchemy + Async)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",  # Alembic 마이그레이션용 (동기)
    "alembic>=1.14.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "authlib>=1.3.0",
    "httpx>=0.28.0",
    # Utils
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.0.0",  # 세션 미들웨어용
    # AI/RAG
    "weaviate-client>=4.0.0",
    "openai>=1.0.0",
    "torch>=2.0.0",  # CPU-only (tool.uv.sources에서 설정)
    "sentence-transformers>=3.0.0",  # Reranker (BGE)
    # Agent (LangGraph)
    "langgraph>=0.2.0",
    # SSE
    "sse-starlette>=2.0.0",
    # S3/MinIO
    "boto3>=1.35.0",
    # XML Parsing
    "lxml>=5.0.0",
    "redis>=7.1.0",
    "langchain-openai>=1.1.7",
    # Audio duration measurement
    "mutagen>=1.47.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

# CPU-only PyTorch 설정 (GPU 불필요, 이미지 ~1.3GB 절약)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # torch만 이 index 사용, 다른 패키지는 PyPI

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
