[project]
name = "oar-11-evidence-rag"
version = "0.1.0"
description = "OAR-11: Evidence RAG 시스템 (임시 E2E 데모)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "weaviate-client>=4.9.0",
    "openai>=1.0.0",
    "tiktoken>=0.7.0",
    "psycopg[binary]>=3.1.0",
    "boto3>=1.34.0",
    "gradio>=4.0.0",
    "ragas>=0.1.0",
    "datasets>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
