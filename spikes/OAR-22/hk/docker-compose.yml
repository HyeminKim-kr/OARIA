version: '3.8'

services:
  # PostgreSQL Database (OAR-73 schema)
  postgres:
    image: postgres:16
    container_name: oaria-postgres
    environment:
      POSTGRES_USER: oaria
      POSTGRES_PASSWORD: oaria123
      POSTGRES_DB: oaria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oaria"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
