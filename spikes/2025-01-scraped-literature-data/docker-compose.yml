version: "3.9"

services:
  backend:
    build: ./backend
    container_name: oaria-lit-backend
    environment:
      MODE: ${MODE:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql://oaria:oaria@db:5432/oaria}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/local_storage}
      GCS_BUCKET: ${GCS_BUCKET:-}
    volumes:
      - ./backend:/app
      - backend_storage:/app/local_storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: oaria-lit-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      MODE: ${MODE:-local}
      # For server-side (Next.js rewrites): use Docker network service name
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: oaria-lit-db
    environment:
      POSTGRES_USER: oaria
      POSTGRES_PASSWORD: oaria
      POSTGRES_DB: oaria
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oaria -d oaria"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: oaria-lit-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  backend_storage:
