# Local Mode Override
# 로컬 PostgreSQL + 파일 시스템 저장
# 사용: docker-compose -f docker-compose.yml -f docker-compose.override.local.yml up
#
# ⚠️ 주의: DATABASE_URL, LOCAL_DATABASE_URL, GCP_DATABASE_URL은 
#    .env 파일에서 설정하세요. 여기서 설정하면 우선 적용됩니다.

services:
  backend:
    environment:
      MODE: local
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/local_storage
      # DATABASE_URL은 .env에서 관리 (런타임 스위칭 지원)
