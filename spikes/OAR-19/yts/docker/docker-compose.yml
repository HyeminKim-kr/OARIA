services:
  postgres:
    image: postgres:16-alpine
    container_name: oaria-postgres
    environment:
      POSTGRES_DB: oaria
      POSTGRES_USER: oaria
      POSTGRES_PASSWORD: oaria_dev
    ports:
      - "11932:5432"  # 119 (OAR-19) + 32 (from 5432)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oaria -d oaria"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: oaria-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "11900:9000"  # 119 (OAR-19) + 00 (S3 API)
      - "11901:9001"  # 119 (OAR-19) + 01 (Web Console)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO 초기 버킷 생성
  minio-init:
    image: minio/mc:latest
    container_name: oaria-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/oaria-papers --ignore-existing;
      mc anonymous set download myminio/oaria-papers;
      echo 'Bucket oaria-papers created successfully';
      "

volumes:
  postgres_data:
  minio_data:
