[project]
name = "oar-19-parser"
version = "0.1.0"
description = "OAR-19: 논문 메타데이터 파싱 로직"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",       # API 호출
    "lxml>=5.0.0",         # XML 파싱
    "asyncpg>=0.29.0",     # PostgreSQL 비동기
    "boto3>=1.34.0",       # S3 (MinIO)
    "pydantic>=2.0.0",     # 데이터 검증
    "python-dotenv>=1.0.0", # 환경변수
    "streamlit>=1.40.0",   # 데모 UI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
