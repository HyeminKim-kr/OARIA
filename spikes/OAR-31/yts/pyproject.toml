[project]
name = "oar-31-vector-store"
version = "0.1.0"
description = "OAR-31: Vector Store 설정 (Weaviate)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "weaviate-client>=4.9.0",
    "openai>=1.0.0",
    "tiktoken>=0.7.0",
    "psycopg[binary]>=3.1.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
