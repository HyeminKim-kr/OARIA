[project]
name = "oar-9-paper-pipeline"
version = "0.1.0"
description = "OAR-9: 논문 수집 파이프라인 (Europe PMC → PostgreSQL + S3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API 클라이언트
    "httpx>=0.27.0",
    # XML 파싱
    "lxml>=5.0.0",
    # PostgreSQL
    "asyncpg>=0.29.0",
    # S3 (MinIO)
    "boto3>=1.34.0",
    # 설정
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # 데모 UI
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
