# 암 논문 수집/임베딩 서비스 전체 스택
# spikes/yts/docker-compose.yml
#
# 실행: docker-compose up -d
# 로그: docker-compose logs -f
# 종료: docker-compose down

services:
  # ========================================
  # 인프라 서비스
  # ========================================

  postgres:
    image: postgres:16-alpine
    container_name: yts-postgres
    environment:
      POSTGRES_DB: oaria
      POSTGRES_USER: oaria
      POSTGRES_PASSWORD: oaria_dev_2024
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oaria -d oaria"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: yts-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: yts-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_2024
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: yts-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin_2024;
      mc mb myminio/oaria-papers --ignore-existing;
      mc anonymous set download myminio/oaria-papers;
      echo '✅ Bucket oaria-papers created';
      "

  weaviate:
    image: semitechnologies/weaviate:1.28.0
    container_name: yts-weaviate
    ports:
      - "18080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
      LOG_LEVEL: 'info'
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # Celery 워커
  # ========================================

  celery-worker-backfill:
    build:
      context: ..  # spikes/ 폴더
      dockerfile: yts/batch/Dockerfile
    container_name: yts-celery-backfill
    command: celery -A src.celery_app worker -Q backfill --loglevel=info --concurrency=2
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin_2024
      - S3_BUCKET=oaria-papers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  celery-worker-embed:
    build:
      context: ..  # spikes/ 폴더
      dockerfile: yts/batch/Dockerfile
    container_name: yts-celery-embed
    command: celery -A src.celery_app worker -Q embed --loglevel=info --concurrency=1
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin_2024
      - S3_BUCKET=oaria-papers
      - WEAVIATE_HOST=weaviate
      - WEAVIATE_PORT=8080
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: ..  # spikes/ 폴더
      dockerfile: yts/batch/Dockerfile
    container_name: yts-celery-beat
    command: celery -A src.celery_app beat --loglevel=info
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    build:
      context: ..  # spikes/ 폴더
      dockerfile: yts/batch/Dockerfile
    container_name: yts-flower
    command: >
      celery -A src.celery_app flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flower_dev_2024}
    ports:
      - "15555:5555"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

