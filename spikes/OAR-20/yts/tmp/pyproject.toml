[project]
name = "oar-20-paper-collection"
version = "0.1.0"
description = "암 논문 데이터 수집 스파이크"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",          # HTTP 클라이언트
    "biopython>=1.84",        # PubMed E-utilities
    "pyalex>=0.14",           # OpenAlex API
    "rich>=13.7.0",           # 터미널 출력
    "typer>=0.12.0",          # CLI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]
